<svg viewBox="0 -34 970 619" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif">
  <style>
    .pcb-block { fill: #0e3d2c; stroke: #c9a25e; stroke-width: 1; stroke-opacity: 0.5; }
    .board-label { font: 700 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #1b201c; letter-spacing: 0.01em; }
    .board-sub   { font: 500 10.5px/1 ui-monospace, "SF Mono", Consolas, monospace; fill: #6b7268; }

    .pinno      { font: 600 8.5px/1 ui-monospace, "SF Mono", Consolas, monospace; fill: #b9c9bd; }
    .pinlabel-l, .pinlabel-r { font: 500 10.5px/1 ui-monospace, "SF Mono", Consolas, monospace; fill: #6b7268; }
    .pinlabel-l.used, .pinlabel-r.used { fill: #1b201c; font-weight: 700; }

    .pin { fill: #4b5750; stroke: none; }
    .pin.used { stroke-width: 2.5; fill: #eef2ec; }

    .wire { fill: none; stroke-width: 2.25; }

    .cc-pinno { font: 700 10px/1 ui-monospace, "SF Mono", Consolas, monospace; fill: #b9c9bd; }
    .cc-pinlabel { font: 600 10.5px/1 ui-monospace, "SF Mono", Consolas, monospace; fill: #eef2ec; }
    .cc-pinlabel.nc { fill: #b9c9bd; font-weight: 500; }

    .ant { stroke: #6b7268; stroke-width: 3; fill: none; stroke-linecap: round; }
    .sma { fill: #c9a25e; }
  </style>

  <!-- Solid background: this file is embedded directly (not inside a
       themed page), so it needs an explicit background rather than
       relying on transparency to pick up a light backdrop. -->
  <rect x="0" y="-34" width="970" height="619" fill="#ffffff"/>

  <!-- Raspberry Pi header block -->
  <rect x="152" y="18" width="60" height="512" rx="6" class="pcb-block"/>
  <text x="182" y="2" class="board-label" text-anchor="middle">Raspberry Pi 4</text>
  <text x="182" y="16" class="board-sub" text-anchor="middle">40-pin GPIO header</text>

  <!-- 40 pins -->
  <text x="150" y="44" text-anchor="end" class="pinlabel-l">3V3</text>
  <circle cx="168" cy="40" r="5" class="pin used" style="stroke:#b8763c; opacity:0.55" data-pin="1"/>
  <text x="168" y="31" text-anchor="middle" class="pinno">1</text>
  <circle cx="196" cy="40" r="5" class="pin used" style="stroke:#b23b3b" data-pin="2"/>
  <text x="196" y="31" text-anchor="middle" class="pinno">2</text>
  <text x="214" y="44" text-anchor="start" class="pinlabel-r used">5V</text>

  <text x="150" y="69" text-anchor="end" class="pinlabel-l">GPIO2</text>
  <circle cx="168" cy="65" r="5" class="pin" data-pin="3"/>
  <text x="168" y="56" text-anchor="middle" class="pinno">3</text>
  <circle cx="196" cy="65" r="5" class="pin" data-pin="4"/>
  <text x="196" y="56" text-anchor="middle" class="pinno">4</text>
  <text x="214" y="69" text-anchor="start" class="pinlabel-r">5V</text>

  <text x="150" y="94" text-anchor="end" class="pinlabel-l">GPIO3</text>
  <circle cx="168" cy="90" r="5" class="pin" data-pin="5"/>
  <text x="168" y="81" text-anchor="middle" class="pinno">5</text>
  <circle cx="196" cy="90" r="5" class="pin" data-pin="6"/>
  <text x="196" y="81" text-anchor="middle" class="pinno">6</text>
  <text x="214" y="94" text-anchor="start" class="pinlabel-r">GND</text>

  <text x="150" y="119" text-anchor="end" class="pinlabel-l used">GPIO4</text>
  <circle cx="168" cy="115" r="5" class="pin used" style="stroke:#b23e73" data-pin="7"/>
  <text x="168" y="106" text-anchor="middle" class="pinno">7</text>
  <circle cx="196" cy="115" r="5" class="pin" data-pin="8"/>
  <text x="196" y="106" text-anchor="middle" class="pinno">8</text>
  <text x="214" y="119" text-anchor="start" class="pinlabel-r">GPIO14</text>

  <text x="150" y="144" text-anchor="end" class="pinlabel-l used">GND</text>
  <circle cx="168" cy="140" r="5" class="pin used" style="stroke:#363b35" data-pin="9"/>
  <text x="168" y="131" text-anchor="middle" class="pinno">9</text>
  <circle cx="196" cy="140" r="5" class="pin" data-pin="10"/>
  <text x="196" y="131" text-anchor="middle" class="pinno">10</text>
  <text x="214" y="144" text-anchor="start" class="pinlabel-r">GPIO15</text>

  <text x="150" y="169" text-anchor="end" class="pinlabel-l">GPIO17</text>
  <circle cx="168" cy="165" r="5" class="pin" data-pin="11"/>
  <text x="168" y="156" text-anchor="middle" class="pinno">11</text>
  <circle cx="196" cy="165" r="5" class="pin" data-pin="12"/>
  <text x="196" y="156" text-anchor="middle" class="pinno">12</text>
  <text x="214" y="169" text-anchor="start" class="pinlabel-r">GPIO18</text>

  <text x="150" y="194" text-anchor="end" class="pinlabel-l">GPIO27</text>
  <circle cx="168" cy="190" r="5" class="pin" data-pin="13"/>
  <text x="168" y="181" text-anchor="middle" class="pinno">13</text>
  <circle cx="196" cy="190" r="5" class="pin" data-pin="14"/>
  <text x="196" y="181" text-anchor="middle" class="pinno">14</text>
  <text x="214" y="194" text-anchor="start" class="pinlabel-r">GND</text>

  <text x="150" y="219" text-anchor="end" class="pinlabel-l">GPIO22</text>
  <circle cx="168" cy="215" r="5" class="pin" data-pin="15"/>
  <text x="168" y="206" text-anchor="middle" class="pinno">15</text>
  <circle cx="196" cy="215" r="5" class="pin" data-pin="16"/>
  <text x="196" y="206" text-anchor="middle" class="pinno">16</text>
  <text x="214" y="219" text-anchor="start" class="pinlabel-r">GPIO23</text>

  <text x="150" y="244" text-anchor="end" class="pinlabel-l used">3V3</text>
  <circle cx="168" cy="240" r="5" class="pin used" style="stroke:#b8763c" data-pin="17"/>
  <text x="168" y="231" text-anchor="middle" class="pinno">17</text>
  <circle cx="196" cy="240" r="5" class="pin" data-pin="18"/>
  <text x="196" y="231" text-anchor="middle" class="pinno">18</text>
  <text x="214" y="244" text-anchor="start" class="pinlabel-r">GPIO24</text>

  <text x="150" y="269" text-anchor="end" class="pinlabel-l">GPIO10</text>
  <circle cx="168" cy="265" r="5" class="pin" data-pin="19"/>
  <text x="168" y="256" text-anchor="middle" class="pinno">19</text>
  <circle cx="196" cy="265" r="5" class="pin" data-pin="20"/>
  <text x="196" y="256" text-anchor="middle" class="pinno">20</text>
  <text x="214" y="269" text-anchor="start" class="pinlabel-r">GND</text>

  <text x="150" y="294" text-anchor="end" class="pinlabel-l">GPIO9</text>
  <circle cx="168" cy="290" r="5" class="pin" data-pin="21"/>
  <text x="168" y="281" text-anchor="middle" class="pinno">21</text>
  <circle cx="196" cy="290" r="5" class="pin" data-pin="22"/>
  <text x="196" y="281" text-anchor="middle" class="pinno">22</text>
  <text x="214" y="294" text-anchor="start" class="pinlabel-r">GPIO25</text>

  <text x="150" y="319" text-anchor="end" class="pinlabel-l">GPIO11</text>
  <circle cx="168" cy="315" r="5" class="pin" data-pin="23"/>
  <text x="168" y="306" text-anchor="middle" class="pinno">23</text>
  <circle cx="196" cy="315" r="5" class="pin" data-pin="24"/>
  <text x="196" y="306" text-anchor="middle" class="pinno">24</text>
  <text x="214" y="319" text-anchor="start" class="pinlabel-r">GPIO8</text>

  <text x="150" y="344" text-anchor="end" class="pinlabel-l">GND</text>
  <circle cx="168" cy="340" r="5" class="pin" data-pin="25"/>
  <text x="168" y="331" text-anchor="middle" class="pinno">25</text>
  <circle cx="196" cy="340" r="5" class="pin" data-pin="26"/>
  <text x="196" y="331" text-anchor="middle" class="pinno">26</text>
  <text x="214" y="344" text-anchor="start" class="pinlabel-r">GPIO7</text>

  <text x="150" y="369" text-anchor="end" class="pinlabel-l">ID_SD</text>
  <circle cx="168" cy="365" r="5" class="pin" data-pin="27"/>
  <text x="168" y="356" text-anchor="middle" class="pinno">27</text>
  <circle cx="196" cy="365" r="5" class="pin" data-pin="28"/>
  <text x="196" y="356" text-anchor="middle" class="pinno">28</text>
  <text x="214" y="369" text-anchor="start" class="pinlabel-r">ID_SC</text>

  <text x="150" y="394" text-anchor="end" class="pinlabel-l">GPIO5</text>
  <circle cx="168" cy="390" r="5" class="pin" data-pin="29"/>
  <text x="168" y="381" text-anchor="middle" class="pinno">29</text>
  <circle cx="196" cy="390" r="5" class="pin" data-pin="30"/>
  <text x="196" y="381" text-anchor="middle" class="pinno">30</text>
  <text x="214" y="394" text-anchor="start" class="pinlabel-r">GND</text>

  <text x="150" y="419" text-anchor="end" class="pinlabel-l">GPIO6</text>
  <circle cx="168" cy="415" r="5" class="pin" data-pin="31"/>
  <text x="168" y="406" text-anchor="middle" class="pinno">31</text>
  <circle cx="196" cy="415" r="5" class="pin" data-pin="32"/>
  <text x="196" y="406" text-anchor="middle" class="pinno">32</text>
  <text x="214" y="419" text-anchor="start" class="pinlabel-r">GPIO12</text>

  <text x="150" y="444" text-anchor="end" class="pinlabel-l">GPIO13</text>
  <circle cx="168" cy="440" r="5" class="pin" data-pin="33"/>
  <text x="168" y="431" text-anchor="middle" class="pinno">33</text>
  <circle cx="196" cy="440" r="5" class="pin" data-pin="34"/>
  <text x="196" y="431" text-anchor="middle" class="pinno">34</text>
  <text x="214" y="444" text-anchor="start" class="pinlabel-r">GND</text>

  <text x="150" y="469" text-anchor="end" class="pinlabel-l used">GPIO19</text>
  <circle cx="168" cy="465" r="5" class="pin used" style="stroke:#3f9e5e" data-pin="35"/>
  <text x="168" y="456" text-anchor="middle" class="pinno">35</text>
  <circle cx="196" cy="465" r="5" class="pin used" style="stroke:#8a4fb0" data-pin="36"/>
  <text x="196" y="456" text-anchor="middle" class="pinno">36</text>
  <text x="214" y="469" text-anchor="start" class="pinlabel-r used">GPIO16</text>

  <text x="150" y="494" text-anchor="end" class="pinlabel-l used">GPIO26</text>
  <circle cx="168" cy="490" r="5" class="pin used" style="stroke:#2f9ea3" data-pin="37"/>
  <text x="168" y="481" text-anchor="middle" class="pinno">37</text>
  <circle cx="196" cy="490" r="5" class="pin used" style="stroke:#a68a35" data-pin="38"/>
  <text x="196" y="481" text-anchor="middle" class="pinno">38</text>
  <text x="214" y="494" text-anchor="start" class="pinlabel-r used">GPIO20</text>

  <text x="150" y="519" text-anchor="end" class="pinlabel-l used">GND</text>
  <circle cx="168" cy="515" r="5" class="pin used" style="stroke:#363b35" data-pin="39"/>
  <text x="168" y="506" text-anchor="middle" class="pinno">39</text>
  <circle cx="196" cy="515" r="5" class="pin used" style="stroke:#3f6fb0" data-pin="40"/>
  <text x="196" y="506" text-anchor="middle" class="pinno">40</text>
  <text x="214" y="519" text-anchor="start" class="pinlabel-r used">GPIO21</text>

  <!-- RF Transmitter module (pre-existing hardware) -->
  <rect x="610" y="20" width="240" height="120" rx="6" class="pcb-block"/>
  <text x="730" y="-13" class="board-label" text-anchor="middle">RF Transmitter</text>
  <text x="730" y="11" class="board-sub" text-anchor="middle">433.42 MHz + oscillator swap</text>

  <path class="wire" style="stroke:#363b35" d="M168,140 C 340,140 480,55 700,55"/>
  <path class="wire" style="stroke:#b23b3b" d="M196,40 C 340,40 480,85 700,85"/>
  <path class="wire" style="stroke:#b23e73" d="M168,115 C 340,115 480,115 700,115"/>

  <circle cx="700" cy="55" r="5" class="pin used" style="stroke:#363b35"/>
  <text x="715" y="59" text-anchor="start" class="cc-pinlabel">GND</text>

  <circle cx="700" cy="85" r="5" class="pin used" style="stroke:#b23b3b"/>
  <text x="715" y="89" text-anchor="start" class="cc-pinlabel">VCC (5V)</text>

  <circle cx="700" cy="115" r="5" class="pin used" style="stroke:#b23e73"/>
  <text x="715" y="119" text-anchor="start" class="cc-pinlabel">DATA</text>

  <!-- CC1101 module block background (drawn before wires so wire endpoints
       aren't clipped by the opaque board fill) -->
  <rect x="610" y="325" width="240" height="140" rx="6" class="pcb-block"/>
  <text x="730" y="302" class="board-label" text-anchor="middle">CC1101 module</text>
  <text x="730" y="316" class="board-sub" text-anchor="middle">433.42 MHz breakout</text>

  <!-- Wires: Pi pin -> CC1101 pin (VCC defaults to pin 17; pin 1 is the
       dimmed alternate, no wire) -->
  <path class="wire" style="stroke:#b8763c" d="M168,240 C 340,240 444,352 730,352"/>
  <path class="wire" style="stroke:#363b35" d="M168,515 C 320,515 444,352 700,352"/>
  <path class="wire" style="stroke:#2f9ea3" d="M168,490 C 340,490 484,382 700,382"/>
  <path class="wire" style="stroke:#8a4fb0" d="M196,465 C 360,465 504,382 730,382"/>
  <path class="wire" style="stroke:#3f6fb0" d="M196,515 C 380,515 524,412 700,412"/>
  <path class="wire" style="stroke:#a68a35" d="M196,490 C 380,490 544,412 730,412"/>
  <path class="wire" style="stroke:#3f9e5e" d="M168,465 C 340,465 524,442 700,442"/>

  <!-- CC1101 pins (2 cols x 4 rows), numbered per silkscreen -->
  <circle cx="700" cy="352" r="5" class="pin used" style="stroke:#363b35"/>
  <text x="700" y="343" text-anchor="middle" class="cc-pinno">1</text>
  <text x="685" y="356" text-anchor="end" class="cc-pinlabel">GND</text>

  <circle cx="730" cy="352" r="5" class="pin used" style="stroke:#b8763c"/>
  <text x="730" y="343" text-anchor="middle" class="cc-pinno">2</text>
  <text x="745" y="356" text-anchor="start" class="cc-pinlabel">VCC</text>

  <circle cx="700" cy="382" r="5" class="pin used" style="stroke:#2f9ea3"/>
  <text x="700" y="373" text-anchor="middle" class="cc-pinno">3</text>
  <text x="685" y="386" text-anchor="end" class="cc-pinlabel">GDO0</text>

  <circle cx="730" cy="382" r="5" class="pin used" style="stroke:#8a4fb0"/>
  <text x="730" y="373" text-anchor="middle" class="cc-pinno">4</text>
  <text x="745" y="386" text-anchor="start" class="cc-pinlabel">CSN</text>

  <circle cx="700" cy="412" r="5" class="pin used" style="stroke:#3f6fb0"/>
  <text x="700" y="403" text-anchor="middle" class="cc-pinno">5</text>
  <text x="685" y="416" text-anchor="end" class="cc-pinlabel">SCK</text>

  <circle cx="730" cy="412" r="5" class="pin used" style="stroke:#a68a35"/>
  <text x="730" y="403" text-anchor="middle" class="cc-pinno">6</text>
  <text x="745" y="416" text-anchor="start" class="cc-pinlabel">MOSI</text>

  <circle cx="700" cy="442" r="5" class="pin used" style="stroke:#3f9e5e"/>
  <text x="700" y="433" text-anchor="middle" class="cc-pinno">7</text>
  <text x="685" y="446" text-anchor="end" class="cc-pinlabel">MISO</text>

  <circle cx="730" cy="442" r="5" class="pin"/>
  <text x="730" y="433" text-anchor="middle" class="cc-pinno">8</text>
  <text x="745" y="446" text-anchor="start" class="cc-pinlabel nc">GDO2 (NC)</text>

  <!-- SMA connector + antenna -->
  <rect x="850" y="335" width="18" height="18" rx="2" class="sma"/>
  <path class="ant" d="M 868,344 C 895,344 895,300 923,300"/>
  <circle cx="923" cy="300" r="4" fill="#6b7268"/>
  <text x="927" y="304" class="board-sub" text-anchor="start">antenna</text>
</svg>
