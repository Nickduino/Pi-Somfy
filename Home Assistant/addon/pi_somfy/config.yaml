name: "Pi-Somfy"
description: "Operate Somfy RTS shutters via 433.42 MHz RF on Raspberry Pi GPIO"
version: "3.0.0"
slug: "pi_somfy"
url: "https://github.com/Nickduino/Pi-Somfy"
arch:
  - aarch64
  - armv7
boot: auto
startup: application
init: false
ingress: true
ingress_port: 80
ingress_entry: /
panel_icon: "mdi:window-shutter"
panel_title: "Pi-Somfy"
webui: "http://[HOST]:[PORT:80]/"
gpio: true
privileged:
  - SYS_RAWIO
devices:
  - /dev/mem
  - /dev/vcio
  - /dev/gpiochip0
  - /dev/gpiochip4
map:
  - type: data
    read_only: false
ports:
  80/tcp: 9909
ports_description:
  80/tcp: "Pi-Somfy Web UI"
watchdog: "http://[HOST]:[PORT:80]/cmd/getConfig"
options:
  gpio_pin: 4
  spi_sck: 21
  spi_mosi: 20
  spi_miso: 19
  spi_csn: 16
  mqtt_port: 1883
  mqtt_client_id: "somfy-mqtt-bridge"
schema:
  gpio_pin: "int(0,27)"
  rx_gpio_pin: "int(0,27)?"
  spi_sck: "int(0,27)"
  spi_mosi: "int(0,27)"
  spi_miso: "int(0,27)"
  spi_csn: "int(0,27)"
  mqtt_server: "str?"
  mqtt_port: "int(1,65535)"
  mqtt_user: "str?"
  mqtt_password: "password?"
  mqtt_client_id: "str"
discovery:
  - pi_somfy
